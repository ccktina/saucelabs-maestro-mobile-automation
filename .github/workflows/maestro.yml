name: Maestro UI Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-cloud:
    name: Maestro Cloud - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            app_file: demo-app.apk

          - platform: ios
            app_file: iOS-Simulator-MyRNDemoApp.1.3.0-162.zip

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Download Android APK
        if: matrix.platform == 'android'
        run: |
          curl -L --fail --retry 3 \
            https://github.com/saucelabs/my-demo-app-rn/releases/download/v1.3.0/Android-MyDemoAppRN.1.3.0.build-244.apk \
            -o demo-app.apk

      - name: 3. Download iOS Simulator App
        if: matrix.platform == 'ios'
        run: |
          curl -L --fail --retry 3 \
            https://github.com/saucelabs/my-demo-app-rn/releases/download/v1.3.0/iOS-Simulator-MyRNDemoApp.1.3.0-162.zip \
            -o iOS-Simulator-MyRNDemoApp.1.3.0-162.zip

      - name: 3. Run Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v2.0.2
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }} # This is now required in newer versions
          app-file: ${{ matrix.app_file }}
          workspace: .maestro
          env: |
            VALID_USERNAME=${{ secrets.APP_USER }}
            VALID_PASSWORD=${{ secrets.APP_PASS }}
            APP_ID=${{ vars.APP_ID }}
            LOGIN_MENU_ITEM=${{ vars.LOGIN_MENU_ITEM }}